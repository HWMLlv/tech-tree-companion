name: Validate and attest plugin

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const manifest = read('manifest.json'), pkg = read('package.json');
          const lock = read('package-lock.json'), versions = read('versions.json');
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw Error('Use a stable x.y.z version');
          if (pkg.version !== manifest.version || lock.version !== manifest.version || lock.packages[''].version !== manifest.version) throw Error('Version metadata differs');
          if (versions[manifest.version] !== manifest.minAppVersion) throw Error('versions.json differs from manifest');
          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== manifest.version) throw Error('Tag differs from manifest version');
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-release
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error

  attest:
    needs: validate
    if: >-
      github.repository == 'HWMLlv/tech-tree-companion' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: community-release
          path: release-assets
      - name: Attest the validated release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
